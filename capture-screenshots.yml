name: 게시물 백업 캡처 (서비스 계정 키 불필요)

on:
  schedule:
    # 매일 오전 9시 30분 KST = UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # 캡처한 이미지를 저장소에 커밋하기 위해 필요

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (Puppeteer만 필요)
        run: npm install puppeteer
        working-directory: scripts

      - name: 새 게시물 캡처 (저장소 screenshots 폴더에 저장)
        working-directory: scripts
        env:
          # 이 값은 원래 index.html 안에도 그대로 공개되어 있는 값이라 시크릿이 아니어도 안전합니다.
          FIREBASE_API_KEY: AIzaSyBGH-8P0Fh2LajoYUSizWKU8ZVyozi3Mo4
          FIREBASE_PROJECT_ID: seeding-manager-fc674
          PAGES_BASE_URL: https://yjkang-blip.github.io/seeding-manager
        run: node capture-screenshots.js

      - name: 캡처된 이미지 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --staged --quiet || git commit -m "게시물 백업 캡처 자동 추가"
          git push
